<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT / SysEng Learning Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
</head>
<body>
  <!-- หน้าล็อกอิน -->
  <div id="login-wrap" hidden></div>

  <div id="app" hidden>
    <aside id="sidebar">
      <div class="brand">
        <div class="brand-mark">SE</div>
        <div>
          <div class="brand-title">Learning Center</div>
          <div class="brand-sub">IT &amp; SysEng</div>
        </div>
      </div>

      <nav id="nav"></nav>

      <div class="side-foot">
        <div class="user-box" id="user-box"></div>
        <div class="xp-box">
          <div class="xp-row"><span>RANK</span><b id="side-level">—</b></div>
          <div class="bar"><div id="side-bar" class="bar-fill"></div></div>
          <div class="xp-row muted"><span id="side-xp">0 XP</span><span id="side-next">—</span></div>
        </div>
        <button class="btn ghost sm block" id="btn-logout">ออกจากระบบ</button>
      </div>
    </aside>

    <main id="main">
      <header id="topbar">
        <button id="menu-toggle" class="icon-btn" aria-label="เมนู">☰</button>
        <div id="crumbs"></div>
        <div class="spacer"></div>
        <div id="topbar-stats"></div>
      </header>
      <div id="view"></div>
    </main>
  </div>

  <div id="toast-wrap"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
